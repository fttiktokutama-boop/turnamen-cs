<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOTAL POINT FT MAP BESAR BY VINZE</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 20px;
            padding: 0;
        }
        h1 {
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #111;
        }
        .container {
            overflow-x: auto;
            background: #fff;
            padding: 15px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            border-radius: 8px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
            font-size: 13px;
        }
        th, td {
            border: 1px solid #777;
            padding: 6px;
        }
        th {
            background-color: #333;
            color: #fff;
        }
        .sub-header th {
            background-color: #555;
            font-size: 11px;
        }
        input[type="text"], input[type="number"] {
            width: 90%;
            padding: 4px;
            text-align: center;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .total-cell {
            font-weight: bold;
            background-color: #e9ecef;
        }
        .winner-table {
            width: 50%;
            margin: 30px auto 0 auto;
        }
        .winner-table th {
            background-color: #222;
        }
        .gold { background-color: #fff2a8 !important; font-weight: bold; }
        .silver { background-color: #e6e6e6 !important; }
        .bronze { background-color: #f5d1b3 !important; }
        @media (max-width: 768px) {
            .winner-table { width: 100%; }
        }
    </style>
</head>
<body>

    <h1>TOTAL POINT FT MAP BESAR BY VINZE</h1>

    <div class="container">
        <!-- TABEL UTAMA -->
        <table>
            <thead>
                <tr>
                    <th rowspan="2">NO</th>
                    <th rowspan="2">NICKNAME</th>
                    <th colspan="3">MATCH 1</th>
                    <th colspan="3">MATCH 2</th>
                    <th colspan="3">MATCH 3</th>
                    <th colspan="2">TOTAL</th>
                    <th rowspan="2">RANK</th>
                </tr>
                <tr class="sub-header">
                    <th>PLACE</th>
                    <th>KILL</th>
                    <th>POINT</th>
                    <th>PLACE</th>
                    <th>KILL</th>
                    <th>POINT</th>
                    <th>PLACE</th>
                    <th>KILL</th>
                    <th>POINT</th>
                    <th>KILL</th>
                    <th>POINT</th>
                </tr>
            </thead>
            <tbody id="matchBody">
                <!-- 12 Baris Otomatis Dibuat Oleh JS -->
            </tbody>
        </table>

        <!-- TABEL JUARA -->
        <table class="winner-table">
            <thead>
                <tr>
                    <th>JUARA</th>
                    <th>NICKNAME</th>
                    <th>POINT</th>
                </tr>
            </thead>
            <tbody>
                <tr class="gold">
                    <td>1</td>
                    <td id="win1-name">-</td>
                    <td id="win1-point">0</td>
                </tr>
                <tr class="silver">
                    <td>2</td>
                    <td id="win2-name">-</td>
                    <td id="win2-point">0</td>
                </tr>
                <tr class="bronze">
                    <td>3</td>
                    <td id="win3-name">-</td>
                    <td id="win3-point">0</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script>
        const totalRows = 12;
        const tbody = document.getElementById('matchBody');

        // Render 12 baris tabel
        for (let i = 1; i <= totalRows; i++) {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${i}</td>
                <td><input type="text" class="nick" placeholder="Player ${i}" oninput="calculate()"></td>
                <td><input type="number" class="m1-p" oninput="calculate()"></td>
                <td><input type="number" class="m1-k" oninput="calculate()"></td>
                <td><input type="number" class="m1-pt" oninput="calculate()"></td>
                <td><input type="number" class="m2-p" oninput="calculate()"></td>
                <td><input type="number" class="m2-k" oninput="calculate()"></td>
                <td><input type="number" class="m2-pt" oninput="calculate()"></td>
                <td><input type="number" class="m3-p" oninput="calculate()"></td>
                <td><input type="number" class="m3-k" oninput="calculate()"></td>
                <td><input type="number" class="m3-pt" oninput="calculate()"></td>
                <td class="total-cell tot-k">0</td>
                <td class="total-cell tot-pt">0</td>
                <td class="total-cell rank">-</td>
            `;
            tbody.appendChild(tr);
        }

        function calculate() {
            const rows = tbody.querySelectorAll('tr');
            let data = [];

            rows.forEach((row, index) => {
                const getVal = (cls) => parseFloat(row.querySelector('.' + cls).value) || 0;
                const nick = row.querySelector('.nick').value || `Player ${index + 1}`;

                // Hitung total kill & total point
                const totK = getVal('m1-k') + getVal('m2-k') + getVal('m3-k');
                const totPt = getVal('m1-pt') + getVal('m2-pt') + getVal('m3-pt');

                row.querySelector('.tot-k').innerText = totK;
                row.querySelector('.tot-pt').innerText = totPt;

                data.push({
                    index: index,
                    nick: nick,
                    points: totPt,
                    kills: totK
                });
            });

            // Urutkan berdasarkan Poin terbanyak, lalu Kill terbanyak
            let sorted = [...data].sort((a, b) => b.points - a.points || b.kills - a.kills);

            // Set peringkat di tabel utama
            sorted.forEach((item, rankIndex) => {
                rows[item.index].querySelector('.rank').innerText = rankIndex + 1;
            });

            // Update Tabel Juara (Top 3)
            for (let i = 0; i < 3; i++) {
                if (sorted[i] && sorted[i].points > 0) {
                    document.getElementById(`win${i+1}-name`).innerText = sorted[i].nick;
                    document.getElementById(`win${i+1}-point`).innerText = sorted[i].points;
                } else {
                    document.getElementById(`win${i+1}-name`).innerText = '-';
                    document.getElementById(`win${i+1}-point`).innerText = '0';
                }
            }
        }
    </script>
</body>
</html>
